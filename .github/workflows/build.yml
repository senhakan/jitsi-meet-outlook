name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore JitsiMeetOutlook.sln

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Create ClickOnce signing cert
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString -String "local-build" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=AkgunMeetOutlook" -KeyUsage DigitalSignature -FriendlyName "AkgunMeetOutlook" -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(10)
          Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $password
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation "Cert:\CurrentUser\My" -Password $password | Out-Null
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CERT_PATH=$((Resolve-Path cert.pfx).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build solution
        shell: pwsh
        run: |
          msbuild JitsiMeetOutlook.sln `
            /p:Configuration=Release `
            /p:SignManifests=true `
            /p:ManifestKeyFile="$env:CERT_PATH" `
            /p:ManifestKeyPassword="local-build" `
            /p:ManifestCertificateThumbprint="$env:CERT_THUMBPRINT"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: setup/bin/Release/**/*.msi

      - name: Upload Add-in Output
        uses: actions/upload-artifact@v4
        with:
          name: addin
          path: JitsiMeetOutlook/bin/Release/**
